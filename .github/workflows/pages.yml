name: Deploy Pin Atlas to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - uses: actions/cache@v4
        with:
          path: .cache/primary-sources
          key: official-sources-${{ hashFiles('sources/manifest.json') }}
          restore-keys: |
            official-sources-
      - name: Install source verification tools
        run: python -m pip install -r requirements-source-verification.txt
      - name: Verify pin facts against pinned sources and ST table snapshots
        run: python scripts/verify-official-sources.py --table-snapshots
      - name: Check JavaScript and board data
        run: npm run check

  build-and-deploy:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - uses: actions/configure-pages@v5
        id: pages
      - name: Build Jekyll
        env:
          JEKYLL_ENV: production
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: bundle exec jekyll build --baseurl "$PAGES_BASE_PATH"
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
