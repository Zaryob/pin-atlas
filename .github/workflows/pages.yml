name: Deploy Pin Atlas to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - name: Install test dependencies
        run: npm ci
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - uses: actions/cache@v4
        with:
          path: .cache/primary-sources
          key: official-sources-${{ hashFiles('sources/manifest.json') }}
          restore-keys: |
            official-sources-
      - name: Install source verification tools
        run: python -m pip install -r requirements-source-verification.txt
      - name: Verify pin facts against pinned sources and ST table snapshots
        run: python scripts/verify-official-sources.py --table-snapshots
      - name: Check JavaScript and board data
        run: npm run check
      - name: Build and check the project-path preview
        run: npm run build:ui
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Test desktop and mobile user flows
        run: npm run test:ui
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: |
            .cache/playwright-results/
            playwright-report/
          if-no-files-found: ignore

  build-and-deploy:
    needs: validate
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - uses: actions/configure-pages@v5
        id: pages
      - name: Build Jekyll
        env:
          JEKYLL_ENV: production
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: bundle exec jekyll build --baseurl "$PAGES_BASE_PATH"
      - name: Check compiled asset paths
        run: python3 scripts/check-static-paths.py --require-built
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
