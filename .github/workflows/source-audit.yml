name: Audit source downloads without cache
on:
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cold-source-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download recorded URLs and compare locked hashes
        run: python scripts/audit-source-downloads.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-download-audit
          path: .cache/source-download-audit.json
