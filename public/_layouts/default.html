<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  {% include console-analytics.html %}
  <meta name="theme-color" content="#f5f3ed">
  <meta name="description" data-i18n-content="description" content="Interactive pinout guide for Raspberry Pi, Pico, Arduino, ESP, and STM32 boards and chips. Explore pins, filter interfaces, and save wiring plans.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Pin Atlas — Pinout explorer">
  <meta property="og:description" data-i18n-content="description" content="Interactive pinout guide for Raspberry Pi, Pico, Arduino, ESP, and STM32 boards and chips. Explore pins, filter interfaces, and save wiring plans.">
  <meta property="og:url" content="https://zaryob.github.io/pin-atlas/">
  <meta property="og:image" content="https://zaryob.github.io/pin-atlas/assets/social-card.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Pin Atlas — Explore pins and plan connections">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Pin Atlas — Pinout explorer">
  <meta name="twitter:description" data-i18n-content="description" content="Interactive pinout guide for Raspberry Pi, Pico, Arduino, ESP, and STM32 boards and chips. Explore pins, filter interfaces, and save wiring plans.">
  <meta name="twitter:image" content="https://zaryob.github.io/pin-atlas/assets/social-card.png">
  <meta name="twitter:image:alt" content="Pin Atlas — Explore pins and plan connections">
  <title data-i18n="pageTitle">{{ page.title | default: site.title | escape }}</title>
  <link rel="icon" type="image/svg+xml" href="{{ '/favicon.svg' | relative_url }}">
  <script src="{{ '/assets/console/language.js' | relative_url }}"></script>
  <script src="{{ '/i18n.js' | relative_url }}?v={{ site.time | date: '%s' }}"></script>
  <script src="{{ '/assets/console/theme.js' | relative_url }}"></script>
  <link rel="stylesheet" href="{{ '/assets/console/theme.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/style.css' | relative_url }}?v={{ site.time | date: '%s' }}">
  <script type="module" src="{{ '/app.js' | relative_url }}?v={{ site.time | date: '%s' }}"></script>
  <link rel="canonical" href="https://zaryob.github.io/pin-atlas/">
</head>
<body class="pin-atlas-site">
  {% include console-header.html %}
  <a class="skip" href="#main"><span data-i18n="skip">Skip to content</span></a>
{{ content }}
{% include site-footer.html %}
</body>
</html>
