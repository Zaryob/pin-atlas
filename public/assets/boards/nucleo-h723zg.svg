<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 840">
  <path d="M100 24h760a14 14 0 0 1 14 14v764l-22 24H122l-22-24V38a14 14 0 0 1 14-14Z" fill="#243831" stroke="#7d9685" stroke-width="2"/>
  <path d="M90 195h780" stroke="#b2c6b4" stroke-width="2" stroke-dasharray="10 7"/>
  <!-- Connector footprints -->
  <g fill="#12241f" stroke="#485f55">
    <!-- MORPHO left & right -->
    <rect x="96" y="218" width="48" height="520" rx="4"/>
    <rect x="816" y="218" width="48" height="520" rx="4"/>
    <!-- ST Zio CN7 & CN8 -->
    <rect x="226" y="210" width="56" height="536" rx="4"/>
    <rect x="678" y="210" width="56" height="536" rx="4"/>
  </g>
  <!-- ST-LINK USB at top -->
  <g fill="#cfdad7" stroke="#7e9693">
    <rect x="445" y="14" width="70" height="52" rx="4"/>
    <path d="M453 24h54v14h-54z" fill="#0e1e19"/>
  </g>
  <!-- ST-LINK MCU -->
  <g fill="#16221c" stroke="#748c7f">
    <rect x="435" y="86" width="90" height="74" rx="4"/>
  </g>
  <!-- Main Target MCU STM32H723ZGT6 LQFP-144 -->
  <g fill="#18251e" stroke="#789284">
    <rect x="420" y="400" width="120" height="120" rx="6"/>
  </g>
  <!-- MCU package pins indication -->
  <g stroke="#9ab29e" stroke-width="1.5">
    <path d="M428 396h104m-104 128h104m-112-116v104m128-104v104" stroke-dasharray="2 3" stroke-width="5"/>
    <circle cx="432" cy="412" r="3.5" fill="#a8c0ab"/>
  </g>
  <!-- Buttons: B1 (Blue) and B2 (Black) -->
  <g>
    <rect x="330" y="740" width="40" height="36" rx="4" fill="#1b2a23" stroke="#5d786b"/>
    <rect x="336" y="746" width="28" height="24" rx="3" fill="#1e88e5" stroke="#1565c0"/>
    <rect x="590" y="740" width="40" height="36" rx="4" fill="#1b2a23" stroke="#5d786b"/>
    <rect x="596" y="746" width="28" height="24" rx="3" fill="#212121" stroke="#424242"/>
  </g>
  <!-- User LEDs: LD1 (Green), LD2 (Yellow), LD3 (Red) -->
  <g>
    <circle cx="450" cy="560" r="4.5" fill="#2ecc71" stroke="#27ae60"/>
    <circle cx="480" cy="560" r="4.5" fill="#f1c40f" stroke="#d4ac0d"/>
    <circle cx="510" cy="560" r="4.5" fill="#e74c3c" stroke="#c0392b"/>
  </g>
  <!-- RJ45 Ethernet Connector at bottom left -->
  <g fill="#2b3b34" stroke="#6f887b">
    <rect x="170" y="750" width="90" height="68" rx="4"/>
    <rect x="185" y="762" width="60" height="46" rx="2" fill="#101c18"/>
  </g>
  <!-- USB Type-C User Connector at bottom right -->
  <g fill="#cfdad7" stroke="#7e9693">
    <rect x="700" y="760" width="60" height="48" rx="5"/>
    <rect x="710" y="772" width="40" height="24" rx="3" fill="#0e1e19"/>
  </g>
  <!-- Text Labels -->
  <g fill="#d2e0d5" font-family="monospace" text-anchor="middle">
    <text x="480" y="118" font-size="12" font-weight="bold">ST-LINK/V3</text>
    <text x="480" y="145" font-size="10" fill="#93aca0">DEBUGGER</text>
    <text x="480" y="185" font-size="13" font-weight="bold">MB1364 · NUCLEO-144</text>
    <text x="480" y="456" font-size="12" font-weight="bold">STM32H723ZG</text>
    <text x="480" y="476" font-size="10" fill="#9bb3a4">LQFP-144 · 550 MHz</text>
    <text x="120" y="212" font-size="12" font-weight="bold">MORPHO</text>
    <text x="840" y="212" font-size="12" font-weight="bold">MORPHO</text>
    <text x="254" y="204" font-size="13" font-weight="bold">CN7 (Zio)</text>
    <text x="706" y="204" font-size="13" font-weight="bold">CN8 (Zio)</text>
    <text x="350" y="792" font-size="9" fill="#9bb3a4">B1 USER</text>
    <text x="610" y="792" font-size="9" fill="#9bb3a4">B2 RESET</text>
    <text x="480" y="582" font-size="9" fill="#9bb3a4">LD1  LD2  LD3</text>
    <text x="215" y="828" font-size="10" fill="#9bb3a4">ETHERNET</text>
    <text x="730" y="824" font-size="10" fill="#9bb3a4">USER USB</text>
  </g>
</svg>
