<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="1380" viewBox="0 0 1160 1380">
<!-- Raspberry Pi Compute Module 4 / 5: the two 100-way board-to-board connectors.
     Schematic, not to scale. Odd contacts are drawn in the left column of each
     connector and labelled to the left; even contacts in the right column, labelled
     to the right. Contact positions come from scripts/cm_sources.py. -->
<g font-family="monospace" text-anchor="middle">
 <text x="290" y="96" font-size="14" font-weight="bold" fill="#cfab5b">CN1</text>
 <text x="290" y="114" font-size="10" fill="#8faab8">contacts 1–100</text>
 <rect x="252" y="124" width="76" height="1200" rx="6" fill="#182723" stroke="#48685e" stroke-width="2"/>
 <rect x="262" y="132" width="56" height="1184" rx="3" fill="#13201c" stroke="#2a453d" stroke-dasharray="4 6"/>
 <text x="270" y="1342" font-size="9" fill="#6d8896">odd</text>
 <text x="310" y="1342" font-size="9" fill="#6d8896">even</text>

 <text x="870" y="96" font-size="14" font-weight="bold" fill="#cfab5b">CN2</text>
 <text x="870" y="114" font-size="10" fill="#8faab8">contacts 101–200</text>
 <rect x="832" y="124" width="76" height="1200" rx="6" fill="#182723" stroke="#48685e" stroke-width="2"/>
 <rect x="842" y="132" width="56" height="1184" rx="3" fill="#13201c" stroke="#2a453d" stroke-dasharray="4 6"/>
 <text x="850" y="1342" font-size="9" fill="#6d8896">odd</text>
 <text x="890" y="1342" font-size="9" fill="#6d8896">even</text>

 <text x="580" y="40" font-size="15" font-weight="bold" fill="#5f7d8c">Raspberry Pi Compute Module 4 / 5</text>
 <text x="580" y="60" font-size="10" fill="#6d8896">2 × 100-way board-to-board connectors · schematic, not to scale</text>
</g>
</svg>
