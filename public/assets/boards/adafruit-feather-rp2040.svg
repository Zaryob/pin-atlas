 <text x="356" y="84" font-size="8" fill="#1e2d30">BOOT</text>

 <!-- Board Title -->
 <text x="410" y="145" font-size="15" font-weight="bold" fill="#e8f3ef">Adafruit Feather</text>
 <text x="410" y="165" font-size="12" fill="#9db08f">RP2040</text>

 <!-- NeoPixel RGB LED & Red LED D13 -->
 <rect x="315" y="150" width="20" height="20" rx="3" fill="#2d3d36" stroke="#4d665b"/>
 <circle cx="325" cy="160" r="4" fill="#4ade80"/>
 <text x="325" y="182" font-size="8" fill="#9db08f">RGB</text>

 <rect x="475" y="150" width="20" height="20" rx="3" fill="#3d2d2d" stroke="#664d4d"/>
 <circle cx="485" cy="160" r="4" fill="#f87171"/>
 <text x="485" y="182" font-size="8" fill="#e0a0a0">D13</text>

 <!-- RP2040 QFN-56 Chip -->
 <rect x="355" y="215" width="110" height="110" rx="5" fill="#27362f" stroke="#5c7a6e"/>
 <circle cx="367" cy="227" r="3" fill="#a9b796"/>
 <text x="410" y="265" font-size="16" font-weight="bold" fill="#dce6d0">RP2040</text>
 <text x="410" y="285" font-size="10" fill="#9db08f">ARM Cortex-M0+</text>
 <text x="410" y="303" font-size="9" fill="#758f7e">133 MHz</text>

 <!-- 8MB SPI Flash -->
 <rect x="365" y="360" width="90" height="60" rx="4" fill="#232833" stroke="#48566a"/>
 <text x="410" y="392" font-size="12" font-weight="bold" fill="#c0cbe0">8 MB</text>
 <text x="410" y="408" font-size="9" fill="#8896aa">QSPI FLASH</text>

 <!-- STEMMA QT Connector (Qwiic compatible) -->
 <rect x="360" y="475" width="100" height="40" rx="4" fill="#2a303c" stroke="#5d6d85"/>
 <text x="410" y="497" font-size="10" font-weight="bold" fill="#89a0c7">STEMMA QT</text>
 <text x="410" y="509" font-size="8" fill="#6d7d96">I2C (SDA/SCL)</text>

 <!-- Headers Labels -->
 <text x="296" y="94" font-size="9" font-weight="bold" fill="#7ba598">1-16</text>
 <text x="524" y="206" font-size="9" font-weight="bold" fill="#7ba598">17-28</text>
