 <!-- LiPo JST Connector -->
 <rect x="460" y="65" width="56" height="40" rx="4" fill="#e8edf0" stroke="#7c8a99"/>
 <text x="488" y="89" font-size="8" fill="#3b4856" font-weight="bold">LiPo BATT</text>

 <!-- Buttons -->
 <rect x="312" y="70" width="24" height="20" rx="3" fill="#b0b8ba" stroke="#5a686b"/>
 <text x="324" y="84" font-size="8" fill="#1e2d30">RST</text>
